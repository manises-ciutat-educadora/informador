<!DOCTYPE html>
<html lang="ca-valencia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor · Regidoria d'Educació de Manises</title>
<style>
:root{--orange:#E87722;--orange-dark:#C75F12;--ink:#1f2937;--muted:#6b7280;--bg:#fff7f0;--card:#ffffff;--border:#f0d9c8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg),#fff);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.wrap{width:min(920px,92%);margin:28px auto}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 34px rgba(199,95,18,.12);padding:26px}h1{margin:0 0 8px;color:var(--orange-dark);font-size:clamp(22px,3vw,32px)}p{margin:0 0 16px;color:var(--muted)}label{display:block;font-weight:800;margin:14px 0 8px}input,select,textarea{width:100%;font:inherit;border:2px solid #e7c7ae;border-radius:12px;padding:12px 14px;background:#fff}textarea{min-height:180px;resize:vertical}button{font:900 16px/1 system-ui,sans-serif;border:0;border-radius:999px;padding:14px 20px;background:linear-gradient(180deg,#ff9a3d,var(--orange) 60%,var(--orange-dark));color:#fff;cursor:pointer;box-shadow:0 8px 0 #8a3f08,0 14px 24px rgba(122,54,6,.25)}button:active{transform:translateY(5px);box-shadow:0 3px 0 #8a3f08}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}.status{min-height:1.5em;margin-top:12px;font-weight:700}.status.ok{color:#047857}.status.err{color:#b91c1c}.locked{max-width:560px;margin:8vh auto}</style>
<base target="_blank">
</head>
<body>
<div class="wrap">
  <section id="lock" class="card locked" aria-label="Accés al gestor">
    <h1>Gestió de comunicacions de la Regidoria d'Educació de Manises</h1>
    <label for="clau">Clau d'accés</label>
    <input id="clau" type="password" autocomplete="current-password" placeholder="Clau del gestor">
    <div class="row" style="margin-top:14px"><button id="unlock" type="button">Accedir</button></div>
    <div id="lockStatus" class="status err" role="status"></div>
  </section>

  <section id="manager" class="card" hidden aria-label="Formulari del gestor">
    <h1>Gestió de comunicacions de la Regidoria d'Educació de Manises</h1>
    <p>Registra la informació de la comunicació: dia, hora, idioma, rol, sessió i text. Fes clic al botó Arxivar text. Després, tanca la sessió.</p>
    <form id="form" autocomplete="off">
      <div class="grid2">
        <div><label for="dia">Dia</label><input id="dia" type="date" required></div>
        <div><label for="hora">Hora</label><input id="hora" type="time" required></div>
        <div><label for="idioma">Idioma</label><input id="idioma" type="text" placeholder="ca / es / en..."></div>
        <div><label for="rol">Rol</label><input id="rol" type="text" required placeholder="Rol de la persona"></div>
      </div>
      <label for="sesion">Sessió</label>
      <input id="sesion" type="text" placeholder="Identificador de sessió (opcional)">
      <label for="texto">Text</label>
      <textarea id="texto" required placeholder="Escriu ací el contingut..."></textarea>
      <div class="row" style="margin-top:14px">
        <button type="submit">Arxivar text</button>
        <button type="button" id="logout" style="background:#6b7280;box-shadow:0 8px 0 #374151,0 14px 24px rgba(0,0,0,.14)">Tancar sessió</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </form>
  </section>
</div>

<script>
"use strict";
// ─── CONFIGURA AQUÍ ─────────────────────────────────────────────────────
const SUPABASE_URL = "https://amswkfdhwashotagrhfo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_J-PhmX7Awpb8UwDYXhYwWg_iISrccBy"; // clau publicable; no usar sb_secret_ ni service_role en front-end
const GESTOR_CLAU = "justairufina";
const ATENCIO_ENDPOINT = SUPABASE_URL + "/rest/v1/gestor_educacio_manises";

const $ = (id) => document.getElementById(id);
const lock = $("lock"), manager = $("manager"), status = $("status");

function setStatus(el, msg, ok){ el.textContent = msg; el.className = "status " + (ok ? "ok" : "err"); }
function unlocked(){ return sessionStorage.getItem("gestor_manises_unlocked") === "1"; }
function showManager(){ lock.hidden = true; manager.hidden = false; $("texto").focus(); }
function showLock(){
  lock.hidden = false; manager.hidden = true; $("clau").focus();
  $("texto").value = ""; $("sesion").value = "";
  setStatus(status, "", true);
}

async function sbInsert(payload){
  const r = await fetch(ATENCIO_ENDPOINT, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify(payload)
  });
  if (!r.ok) throw new Error("HTTP " + r.status + " — " + await r.text());
}

$("unlock").addEventListener("click", () => {
  if($("clau").value === GESTOR_CLAU){
    sessionStorage.setItem("gestor_manises_unlocked", "1");
    setStatus($("lockStatus"), "", true);
    showManager();
  }else{
    setStatus($("lockStatus"), "Clau incorrecta.", false);
  }
});
$("clau").addEventListener("keydown", (e) => { if(e.key === "Enter") $("unlock").click(); });
$("logout").addEventListener("click", () => { sessionStorage.removeItem("gestor_manises_unlocked"); showLock(); });
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = {
    dia: $("dia").value || null,
    hora: $("hora").value || null,
    idioma: $("idioma").value.trim() || null,
    rol: $("rol").value.trim(),
    sesion: $("sesion").value.trim() || null,
    texto: $("texto").value.trim()
  };
  if(!payload.rol || !payload.texto) return;
  setStatus(status, "Arxivant...", true);
  try{
    await sbInsert(payload);
    $("texto").value = ""; $("sesion").value = "";
    setStatus(status, "S'ha arxivat correctament.", true);
  }catch(err){
    console.error(err);
    setStatus(status, "Error en arxivar. Revisa la clau anon, RLS i la taula.", false);
  }
});

if(unlocked()) showManager(); else showLock();
</script>
</body>
</html>
